name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Snapricot.slnx

      - name: Build
        run: dotnet build Snapricot.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Snapricot.slnx -c Release --no-build

  aot-windows:
    name: Native AOT publish and startup budget (Windows)
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish (Native AOT)
        run: dotnet publish src/Snapricot.App -c Release -r win-x64 -o artifacts/publish/win-x64

      - name: Measure startup
        shell: pwsh
        continue-on-error: true # CI runners are noisy: report, don't gate (docs/architecture/performance.md)
        run: |
          $exe = "artifacts/publish/win-x64/Snapricot.exe"
          $result = Join-Path $env:RUNNER_TEMP "startup.json"
          $runs = foreach ($i in 1..3) {
            $p = Start-Process -FilePath $exe -ArgumentList "--measure-startup", $result -PassThru
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Startup measurement timed out" }
            Get-Content $result | ConvertFrom-Json
          }
          $best = $runs | Sort-Object startupMs | Select-Object -First 1
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          @(
            "### Performance (Native AOT, win-x64)"
            ""
            "| Metric | Value | Budget |"
            "|---|---|---|"
            "| Startup (best of 3) | $($best.startupMs) ms | < 300 ms |"
            "| Working set | $($best.workingSetMb) MB | < 60 MB |"
            "| Snapricot.exe size | $sizeMb MB | |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: snapricot-win-x64
          path: artifacts/publish/win-x64
          retention-days: 14
